<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow từ cuộc họp qua chuyên gia duyệt đến công nhân; lỗi chưa xử lý được chuyển kỹ sư và ghi chú quay lại duyệt"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#556473"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;font-size:13px;fill:#19232f}.n{fill:#fff;stroke:#cbd3dd;stroke-width:1.4}.a{fill:none;stroke:#556473;stroke-width:1.5;marker-end:url(#arrow)}.t{font-size:10px;fill:#718093}.r{stroke:#cf1738;fill:#fff2f5}.g{stroke:#138462;fill:#edf8f2}</style><rect x="15" y="16" width="870" height="193" rx="10" fill="#f5f6f8"/><text x="34" y="39" class="t">TRỤ CỘT 1 · BÁO CÁO VÀ SỐ HÓA QUYẾT ĐỊNH</text><rect class="n" x="34" y="65" width="166" height="61" rx="7"/><text x="117" y="91" text-anchor="middle">Ghi âm + bản vẽ</text><text x="117" y="109" text-anchor="middle" class="t">Từ điển kỹ thuật</text><path class="a" d="M200 96h42"/><rect class="n" x="243" y="65" width="166" height="61" rx="7"/><text x="326" y="91" text-anchor="middle">AI trích xuất báo cáo</text><text x="326" y="109" text-anchor="middle" class="t">Quyết định + nguồn + bất đồng</text><path class="a" d="M409 96h42"/><rect class="n r" x="452" y="65" width="166" height="61" rx="7"/><text x="535" y="91" text-anchor="middle">Chuyên gia kiểm duyệt</text><text x="535" y="109" text-anchor="middle" class="t">Sửa / Yêu cầu chỉnh / Duyệt</text><path class="a" d="M618 96h42"/><rect class="n g" x="661" y="65" width="196" height="61" rx="7"/><text x="759" y="91" text-anchor="middle">Tri thức đã duyệt · v1</text><text x="759" y="109" text-anchor="middle" class="t">Phạm vi + phiên bản + người duyệt</text><path class="a" d="M535 126v47H326v-43"/><text x="430" y="165" class="t" text-anchor="middle">Thiếu nguồn / Chưa thống nhất → chỉnh bản nháp</text><path class="a" d="M759 126v117H535v23"/><rect x="15" y="226" width="870" height="294" rx="10" fill="#f5f6f8"/><text x="34" y="250" class="t">TRỤ CỘT 2 · ÁP DỤNG ĐÚNG PHẠM VI VÀ HỌC TỪ HIỆN TRƯỜNG</text><path class="a" d="M759 209v34H535v23"/><rect class="n" x="34" y="269" width="166" height="61" rx="7"/><text x="117" y="295" text-anchor="middle">Công nhân nhập lỗi</text><text x="117" y="313" text-anchor="middle" class="t">Mã lỗi + máy + triệu chứng</text><path class="a" d="M200 299h42"/><rect class="n" x="243" y="269" width="166" height="61" rx="7"/><text x="326" y="295" text-anchor="middle">Tra cứu tri thức đã duyệt</text><text x="326" y="313" text-anchor="middle" class="t">Khớp máy / sản phẩm / hiệu lực?</text><path class="a" d="M409 299h42"/><rect class="n g" x="452" y="269" width="166" height="61" rx="7"/><text x="535" y="295" text-anchor="middle">Action Card có nguồn</text><text x="535" y="313" text-anchor="middle" class="t">Thực hiện theo SOP</text><path class="a" d="M618 299h42"/><rect class="n g" x="661" y="269" width="196" height="61" rx="7"/><text x="759" y="295" text-anchor="middle">Hiệu quả → ghi nhận</text><text x="759" y="313" text-anchor="middle" class="t">Đóng case demo + phản hồi</text><path class="a" d="M326 330v59"/><text x="312" y="361" class="t" text-anchor="end">Không có kết quả</text><path class="a" d="M535 330v59"/><text x="546" y="362" class="t">Chưa hiệu quả / ngoài phạm vi</text><rect class="n r" x="243" y="390" width="375" height="61" rx="7"/><text x="430" y="416" text-anchor="middle">Chuyển kỹ sư → xử lý → ghi chú hiện trường</text><text x="430" y="434" text-anchor="middle" class="t">Nguyên nhân thực tế + cách xử lý + bằng chứng</text><path class="a" d="M618 421h42"/><rect class="n r" x="661" y="390" width="196" height="61" rx="7"/><text x="759" y="416" text-anchor="middle">Tạo bản nháp v2</text><text x="759" y="434" text-anchor="middle" class="t">Chuyên gia duyệt trước khi dùng</text><path class="a" d="M857 421h22V163H759v-33"/><text x="746" y="484" class="t" text-anchor="middle">Duyệt v2 → phát hành v2; v1 giữ lịch sử</text></svg>